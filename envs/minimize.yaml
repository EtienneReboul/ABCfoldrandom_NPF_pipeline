name: abcfoldrandom-minimize
# tm_minimize: OpenMM minimization of the exported models (ported from
# NanoPulldown's envs/minimize.yaml). conda-forge's OpenMM ships the CUDA and
# OpenCL platforms (OpenCL = Apple GPU on the Mac).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - openmm>=8.1
  - pdbfixer>=1.9
  - numpy>=1.26
  - pandas>=2.0
  - pyarrow>=15.0
